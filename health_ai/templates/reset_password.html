{% extends "base.html" %}
{% block title %}Reset Password — AI Health System{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-lock-open"></i></div>
      <h2>Set New Password</h2>
      <p>Choose a strong password for your account</p>
    </div>
    <div class="steps-indicator">
      <div class="step done"><span><i class="fas fa-check"></i></span> Email</div>
      <div class="step-line active"></div>
      <div class="step done"><span><i class="fas fa-check"></i></span> OTP</div>
      <div class="step-line active"></div>
      <div class="step active"><span>3</span> Reset</div>
    </div>
    <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form">
      <div class="form-group">
        <label for="new_password"><i class="fas fa-lock"></i> New Password</label>
        <div class="input-eye">
          <input type="password" id="new_password" name="new_password" placeholder="Min. 6 characters" required autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="togglePassword('new_password')"><i class="fas fa-eye" id="eye-new_password"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm_password"><i class="fas fa-lock"></i> Confirm New Password</label>
        <div class="input-eye">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="togglePassword('confirm_password')"><i class="fas fa-eye" id="eye-confirm_password"></i></button>
        </div>
      </div>
      <div id="password-strength" class="password-strength"></div>
      <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-save"></i> Reset Password</button>
    </form>
  </div>
</div>
<script>
document.getElementById('new_password').addEventListener('input', function() {
  var val=this.value, el=document.getElementById('password-strength'), s=0;
  if(!val){el.innerHTML='';return;}
  if(val.length>=6)s++;if(val.length>=10)s++;
  if(/[A-Z]/.test(val))s++;if(/[0-9]/.test(val))s++;if(/[^A-Za-z0-9]/.test(val))s++;
  var l=['','Very Weak','Weak','Fair','Strong','Very Strong'],c=['','#dc3545','#fd7e14','#ffc107','#28a745','#155724'];
  el.innerHTML='<span style="color:'+c[s]+'">Password strength: '+l[s]+'</span>';
});
</script>
{% endblock %}
