{% extends "base.html" %}
{% block title %}Forgot Password - AI Health System{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset OTP</p>
    </div>
    <div class="steps-indicator">
      <div class="step active"><span>1</span> Email</div>
      <div class="step-line"></div>
      <div class="step"><span>2</span> OTP</div>
      <div class="step-line"></div>
      <div class="step"><span>3</span> Reset</div>
    </div>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Registered Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-paper-plane"></i> Send OTP
      </button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('auth.login') }}" class="btn btn-outline btn-sm" style="margin-right:8px;">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>
      <a href="{{ url_for('auth.home') }}" class="btn btn-outline btn-sm">
        <i class="fas fa-house"></i> Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
