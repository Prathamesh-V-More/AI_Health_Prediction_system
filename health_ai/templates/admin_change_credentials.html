{% extends "base.html" %}
{% block title %}Change Admin Credentials{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon" style="background:linear-gradient(135deg,#6f42c1,#4a1d96);">
        <i class="fas fa-user-cog"></i>
      </div>
      <h2>Change Admin Credentials</h2>
      <p>Update your admin email and/or password</p>
    </div>

    <form method="POST" action="{{ url_for('auth.admin_change_credentials') }}" class="auth-form">

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Current Password *</label>
        <div class="input-eye">
          <input type="password" name="current_password" id="current_password"
                 placeholder="Enter current password" required/>
          <button type="button" class="eye-btn" onclick="togglePassword('current_password')">
            <i class="fas fa-eye" id="eye-current_password"></i>
          </button>
        </div>
      </div>

      <hr style="border:none;border-top:1px solid #dee2e6;margin:8px 0;"/>

      <div class="form-group">
        <label><i class="fas fa-envelope"></i> New Email (leave blank to keep current)</label>
        <input type="email" name="new_email"
               placeholder="{{ session.get('user_email','') }}"
               value="{{ session.get('user_email','') }}"/>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> New Password (leave blank to keep current)</label>
        <div class="input-eye">
          <input type="password" name="new_password" id="new_password"
                 placeholder="Min. 6 characters"/>
          <button type="button" class="eye-btn" onclick="togglePassword('new_password')">
            <i class="fas fa-eye" id="eye-new_password"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Confirm New Password</label>
        <div class="input-eye">
          <input type="password" name="confirm_password" id="confirm_password"
                 placeholder="Repeat new password"/>
          <button type="button" class="eye-btn" onclick="togglePassword('confirm_password')">
            <i class="fas fa-eye" id="eye-confirm_password"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-admin btn-full">
        <i class="fas fa-save"></i> Update Credentials
      </button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline btn-sm">
        <i class="fas fa-arrow-left"></i> Back to Admin Panel
      </a>
    </div>
  </div>
</div>
{% endblock %}
