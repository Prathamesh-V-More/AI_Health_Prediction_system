{% extends "base.html" %}
{% block title %}Login - AI Health System{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-heartbeat"></i></div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <div class="input-eye">
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password"/>
          <button type="button" class="eye-btn" onclick="togglePassword('password')">
            <i class="fas fa-eye" id="eye-password"></i>
          </button>
        </div>
      </div>
      <div class="form-row-between">
        <label class="checkbox-label"><input type="checkbox" name="remember"/> Remember me</label>
        <a href="{{ url_for('auth.forgot_password') }}" class="link-forgot">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('auth.home') }}" class="btn btn-outline btn-sm" style="margin-bottom:10px;display:inline-flex;">
        <i class="fas fa-house"></i> Home
      </a>
      <br/>
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
      &nbsp;|&nbsp;
      <a href="{{ url_for('auth.admin_login') }}">Admin Login</a>
    </div>
  </div>
</div>
{% endblock %}
