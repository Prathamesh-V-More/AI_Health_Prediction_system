{% extends "base.html" %}
{% block title %}Register — AI Health System{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card auth-card-wide">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
      <h2>Create Account</h2>
      <p>Join the AI Health Prediction System</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">

      <div class="form-row-2">
        <div class="form-group">
          <label for="full_name"><i class="fas fa-user"></i> Full Name *</label>
          <input type="text" id="full_name" name="full_name"
                 value="{{ full_name or '' }}" placeholder="John Doe" required/>
        </div>
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email Address *</label>
          <input type="email" id="email" name="email"
                 value="{{ email or '' }}" placeholder="you@example.com"
                 required autocomplete="email"/>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password *</label>
          <div class="input-eye">
            <input type="password" id="password" name="password"
                   placeholder="Min. 6 characters" required autocomplete="new-password"/>
            <button type="button" class="eye-btn" onclick="togglePassword('password')">
              <i class="fas fa-eye" id="eye-password"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password"><i class="fas fa-lock"></i> Confirm Password *</label>
          <div class="input-eye">
            <input type="password" id="confirm_password" name="confirm_password"
                   placeholder="Repeat password" required autocomplete="new-password"/>
            <button type="button" class="eye-btn" onclick="togglePassword('confirm_password')">
              <i class="fas fa-eye" id="eye-confirm_password"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label for="age"><i class="fas fa-birthday-cake"></i> Age *</label>
          <input type="number" id="age" name="age"
                 value="{{ age or '' }}" placeholder="25" min="1" max="120" required/>
        </div>
        <div class="form-group">
          <label for="gender"><i class="fas fa-venus-mars"></i> Gender *</label>
          <select id="gender" name="gender" required>
            <option value="">Select gender</option>
            <option value="Male"   {% if gender == 'Male'   %}selected{% endif %}>Male</option>
            <option value="Female" {% if gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other"  {% if gender == 'Other'  %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="phone"><i class="fas fa-phone"></i> Phone Number *</label>
          <input type="tel" id="phone" name="phone"
                 value="{{ phone or '' }}" placeholder="+1 234 567 8900" required/>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
